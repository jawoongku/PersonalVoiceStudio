name: Personal Voice Studio CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependency
        run: python -m pip install pyyaml
      - name: Run unit tests
        run: python -m unittest discover -s tests -q

  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftUI shell
        run: swift build -c release
        working-directory: mac_app
      - name: Build and check app bundle
        run: |
          scripts/build_macos_app.sh
          scripts/check_app_bundle.sh
